[package]
name = "dawnstore-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio.workspace = true

# Logging (file-based — stdout is taken over by the TUI)
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Error handling
color-eyre.workspace = true

# Serialisation
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true

# CLI argument parsing (same context flags as dawnstore-cli)
clap = { version = "4.5.54", features = ["derive", "env"] }

# XDG data directory for the log file
dirs = "5"

# Dawnstore
dawnstore-client-lib = { path = "../dawnstore-client-lib" }
dawnstore-lib = { path = "../dawnstore-lib" }
